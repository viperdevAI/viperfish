<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viperfish</title>
  <meta name="description" content="Viperfish: small open-source language models. Something big is coming.">
  <meta name="theme-color" content="#010309">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">

    <!-- Lit copy: only revealed inside the lantern's glow -->
    <div class="text lit">
      <h1>Something big is coming.</h1>
    </div>

    <!-- The glow of the lantern itself -->
    <div class="glow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
